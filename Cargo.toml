[workspace]
resolver = "2"
members = [
    "crates/window-manager",
    "crates/features/desktop",
    "crates/features/topbar",
    "libs/animation",
    "libs/common",
    "libs/services",
    "libs/ui-kit",
    "xtask",
]
default-members = [
    "crates/window-manager",
    "crates/features/desktop",
    "crates/features/topbar",
    "libs/animation",
    "libs/common",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["BabyDraDE Contributors"]

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Guardrails shared by every workspace member. Lints that still have existing
# debt are tracked in `xtask-baseline.toml` and enabled as that debt is cleared.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = "deny"
