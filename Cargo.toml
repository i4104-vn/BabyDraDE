[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/presentation",
    "crates/drade-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["BabyDraDE Contributors"]

[workspace.dependencies]
# === Shared across workspace ===
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

# === Internal crates ===
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
presentation = { path = "crates/presentation" }

[package]
name = "babydrade"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A simple Wayland Desktop Environment built with Rust"

[dependencies]
domain.workspace = true
application.workspace = true
infrastructure.workspace = true
presentation.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

