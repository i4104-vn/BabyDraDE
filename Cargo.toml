[workspace]
resolver = "2"
members = [
    "crates/window-manager",
    "crates/widgets",
    "libs/services",
    "libs/ui-kit",
]
default-members = ["crates/window-manager", "crates/widgets"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["BabyDraDE Contributors"]

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
