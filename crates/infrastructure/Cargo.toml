[package]
name = "infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
smithay = { version = "=0.7.0", default-features = false, features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    "renderer_glow",
    "backend_session_libseat",
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "use_system_lib",
] }
smithay-drm-extras = { version = "0.1", default-features = false }
wayland-sys = { version = "0.31", features = ["dlopen"] }
tracing.workspace = true
libc = "0.2"
gio = { version = "0.22", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
dirs = "5.0"
notify = "6.1"
