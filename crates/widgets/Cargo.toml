[package]
name = "widgets"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "widgets"
path = "src/lib.rs"

[[bin]]
name = "babydra-desktop"
path = "src/bin/babydra-desktop.rs"

[[bin]]
name = "babydra-topbar"
path = "src/bin/babydra-topbar.rs"

[[bin]]
name = "babydra-panel"
path = "src/bin/babydra-panel.rs"

[[bin]]
name = "babydra-screenshot"
path = "src/bin/babydra-screenshot.rs"

[[bin]]
name = "babydra-lock"
path = "src/bin/babydra-lock.rs"

[[bin]]
name = "babydra-widgets"
path = "src/bin/babydra-widgets.rs"

[dependencies]
gtk4 = { version = "0.11" }
gtk4-layer-shell = "0.8"
cairo-rs = { version = "0.22", features = ["png", "use_glib"] }
gdk-pixbuf = "0.22"
glib = "0.22"
gio = "0.22"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "process", "fs", "io-util"] }
dirs = "5.0"
chrono = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
services = { path = "../../libs/services" }
ui-kit = { path = "../../libs/ui-kit" }
tracing.workspace = true
tracing-subscriber.workspace = true
