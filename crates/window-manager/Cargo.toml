[package]
name = "window-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "BabyDraDE Wayland Compositor and Window Manager built on Smithay"

[[bin]]
name = "babydra-window-manager"
path = "src/main.rs"

[dependencies]
smithay = { version = "=0.7.0", default-features = false, features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    "renderer_glow",
    "backend_session_libseat",
    "backend_udev",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "use_system_lib",
] }
smithay-drm-extras = { version = "0.1", default-features = false }
wayland-sys = { version = "0.31", features = ["dlopen"] }
services = { path = "../../libs/services" }
tracing.workspace = true
tracing-subscriber.workspace = true
libc = "0.2"
cairo-rs = "0.22"
glow = "0.16"
