<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="40%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <radialGradient id="cyan-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1793d1" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#0a4668" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple-glow" cx="80%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#58355E" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%">
