[package]
name = "services"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "BabyDraDE background services, system monitoring, configuration, themes, and i18n"

[dependencies]
libc = "0.2"
gio = { version = "0.22", default-features = false }
cairo-rs = { version = "0.22", features = ["png", "use_glib"] }
cursor-icon = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
dirs = "5.0"
notify = "6.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
